name: Mobile foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run vocabulary:check -- --base "$VOCABULARY_BASE"
        env:
          VOCABULARY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo config --type public
      - run: npx expo install --check
      - run: npm run bundle
